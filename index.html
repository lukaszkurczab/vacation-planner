<!DOCTYPE html><html lang="pl"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/vacation-planner/_next/static/chunks/2-tydhgz_10z3.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/vacation-planner/_next/static/chunks/3l04zcqx63h3y.js"/><script src="/vacation-planner/_next/static/chunks/2253v1q82cf04.js" async=""></script><script src="/vacation-planner/_next/static/chunks/1rj7ns8rte9vc.js" async=""></script><script src="/vacation-planner/_next/static/chunks/turbopack-00uc1bq_16cvo.js" async=""></script><script src="/vacation-planner/_next/static/chunks/3fntmmi971322.js" async=""></script><script src="/vacation-planner/_next/static/chunks/3ni2jimsyhn6h.js" async=""></script><title>Teneryfa · VacationPlanner</title><meta name="description" content="Twoja prywatna mapa miejsc na Teneryfie."/><script src="/vacation-planner/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body><div hidden=""><!--$--><!--/$--></div><main class="planner"><aside class="sidebar"><a class="brand" href="/vacation-planner/" aria-label="VacationPlanner — strona główna"><span class="brand-symbol" aria-hidden="true">↗</span> VacationPlanner</a><div class="destination"><p class="eyebrow">WYSPY KANARYJSKIE</p><h1>Teneryfa<span>.</span></h1><p class="intro">Twoje miejsca. Twój kawałek wyspy.</p></div><section class="places" aria-labelledby="places-title"><div class="section-heading"><h2 id="places-title">Miejsca na mapie</h2><span class="count">28</span></div><button class="filters-toggle" aria-expanded="false" aria-controls="place-filters"><span>Pokaż filtry</span><span aria-hidden="true">+</span></button><div id="place-filters" class="place-controls" hidden=""><label>Szukaj miejsca<input type="search" placeholder="Nazwa lub opis…" value=""/></label><div class="filter-row"><label>Region<select aria-label="Region"><option value="" selected="">Wszystkie</option><option>Teide</option><option>Anaga</option><option>Północ</option><option>Zachód</option><option>Południe</option></select></label><label>Rodzaj<select aria-label="Rodzaj"><option value="" selected="">Wszystkie</option><option>Góry i trekking</option><option>Punkty widokowe</option><option>Miasta i miejscowości</option><option>Plaże i ocean</option></select></label></div><label>Grupuj według<select aria-label="Grupuj według"><option value="none" selected="">Bez grupowania</option><option value="region">Regionu</option><option value="category">Rodzaju miejsca</option></select></label></div><div class="filter-summary"><span role="status">28<!-- --> z <!-- -->28<!-- --> miejsc</span></div><div class="place-results"><div><ul class="place-list"><li><button disabled=""><strong>Park Narodowy Teide</strong><span class="place-meta">Teide<!-- --> · <!-- -->Góry i trekking</span><span>Priorytet obu planów: wulkaniczna kaldera, lawa i widoki. Drugi plan proponuje cały dzień i wjazd przez La Orotavę; oba polecają zachód słońca i gwiazdy. Szczyt i kolejka są opcją. Pinezka wskazuje Teide, nie początek szlaku. Przed wyjazdem sprawdź dostępność tras i wymagane zezwolenia.</span></button></li><li><button disabled=""><strong>Roques de García</strong><span class="place-meta">Teide<!-- --> · <!-- -->Góry i trekking</span><span>Postój w Parku Narodowym Teide z drugiego planu: formacje skalne i krótki trekking w kalderze przed ewentualną kolejką. Pinezka wskazuje grupę skał, nie wyznacza przebiegu spaceru.</span></button></li><li><button disabled=""><strong>Masca</strong><span class="place-meta">Zachód<!-- --> · <!-- -->Miasta i miejscowości</span><span>Wspólna propozycja: wioska między stromymi górami, widoki po drodze i zdjęcia w świetle późnego popołudnia. Sam spacer po wiosce to osobna opcja od trekkingu w wąwozie. Przy wyborze Barranco de Masca nie trzeba planować drugiej wizyty. Sprawdź aktualne zasady dojazdu.</span></button></li><li><button disabled=""><strong>Barranco de Masca · opcjonalny trekking</strong><span class="place-meta">Zachód<!-- --> · <!-- -->Góry i trekking</span><span>Aktywny wariant dnia 5 w drugim planie zamiast spokojnego rejsu przy Los Gigantes. Wymaga osobnego zaplanowania: rezerwacji, dojazdu, transportu powrotnego i obuwia trekkingowego. Pinezka oznacza fragment wąwozu, nie wejście. Szczegóły logistyczne z planu trzeba potwierdzić przed wyjazdem.</span></button></li><li><button disabled=""><strong>Los Gigantes · rejs pod klifami</strong><span class="place-meta">Zachód<!-- --> · <!-- -->Plaże i ocean</span><span>Oba plany polecają zobaczyć klify z małej łodzi, opcjonalnie z obserwacją waleni. W drugim planie to spokojniejszy dzień 5: rejs, plaża i jedzenie. Pinezka wskazuje okolicę mariny, a nie konkretną firmę lub miejsce zbiórki.</span></button></li><li><button disabled=""><strong>El Médano</strong><span class="place-meta">Południe<!-- --> · <!-- -->Miasta i miejscowości</span><span>Pierwszy plan: luźniejszy, surferski klimat, plaża, knajpki i widok na Montaña Roja. Propozycja na 1–2 sesje surfingu; drugi plan nie uwzględnia tego przystanku w pięciodniowej trasie.</span></button></li><li><button disabled=""><strong>Montaña Roja</strong><span class="place-meta">Południe<!-- --> · <!-- -->Góry i trekking</span><span>Pierwszy plan: wejście na wulkaniczny stożek obok El Médano, najlepiej połączone z plażą La Tejita późnym popołudniem. Pinezka wskazuje masyw, nie początek podejścia.</span></button></li><li><button disabled=""><strong>Playa de La Tejita</strong><span class="place-meta">Południe<!-- --> · <!-- -->Plaże i ocean</span><span>Naturalna, rozległa plaża przy Montaña Roja z pierwszego planu. Można połączyć ją z El Médano i wejściem na stożek, jako spokojniejsze popołudnie na południu.</span></button></li><li><button disabled=""><strong>Costa Adeje · opcja bazy</strong><span class="place-meta">Południe<!-- --> · <!-- -->Miasta i miejscowości</span><span>Pierwszy plan proponuje bazę na cieplejszym południu: plaże, restauracje i dostęp do innych części wyspy. Drugi preferuje nocleg w Puerto de la Cruz lub La Orotavie i ograniczenie kurortów. Zachowane jako alternatywa noclegowa, bez narzucania wyboru.</span></button></li><li><button disabled=""><strong>La Caleta · opcja bazy</strong><span class="place-meta">Południe<!-- --> · <!-- -->Miasta i miejscowości</span><span>Pierwszy plan wymienia La Caletę obok Costa Adeje jako opcję pobytu na południu, z restauracjami i dostępem do wybrzeża. Przystanek dodatkowy, bez wysokiego priorytetu zwiedzania.</span></button></li><li><button disabled=""><strong>Los Cristianos</strong><span class="place-meta">Południe<!-- --> · <!-- -->Miasta i miejscowości</span><span>Pierwszy plan: baza, promenada, plaża i możliwość wypłynięcia na ocean. Raczej miejsce na spokojny pobyt niż cel specjalnego przejazdu przez wyspę.</span></button></li><li><button disabled=""><strong>Parque Rural de Anaga</strong><span class="place-meta">Anaga<!-- --> · <!-- -->Góry i trekking</span><span>Priorytet obu planów: góry, mgła, las laurowy i czarne wybrzeże. Drugi plan przeznacza cały dzień: Cruz del Carmen, trekking 2–4 godziny, potem Taganana, Almáciga i Benijo. Odradza długi PR-TF 8 w takim dniu. Pinezka oznacza obszar Anagi; konkretną krótką trasę trzeba jeszcze wybrać.</span></button></li><li><button disabled=""><strong>Camino Viejo al Pico del Inglés</strong><span class="place-meta">Anaga<!-- --> · <!-- -->Góry i trekking</span><span>Stara droga w Anaga z zielonym tunelem utworzonym przez drzewa i porośniętymi mchem ścianami, znana jako Túnel de las Hadas. Przystanek na spacer i zdjęcia, który można połączyć z pobliskim Mirador Pico del Inglés. Pinezka wskazuje okolice wejścia do zielonego tunelu przy TF-114, nie cały przebieg szlaku.</span></button></li><li><button disabled=""><strong>Mirador Pico del Inglés</strong><span class="place-meta">Anaga<!-- --> · <!-- -->Punkty widokowe</span><span>Punkt widokowy w Anaga z pierwszego planu. Możliwy przystanek przed Cruz del Carmen i przejazdem w stronę Taganany, Almácigi i Benijo.</span></button></li><li><button disabled=""><strong>Cruz del Carmen</strong><span class="place-meta">Anaga<!-- --> · <!-- -->Punkty widokowe</span><span>Wspólny punkt obu planów w Anaga: mirador i las laurowy. Drugi proponuje zacząć tu rano dzień z krótszym trekkingiem. Samo wskazanie tego miejsca nie oznacza wyboru konkretnego szlaku.</span></button></li><li><button disabled=""><strong>Taganana</strong><span class="place-meta">Anaga<!-- --> · <!-- -->Miasta i miejscowości</span><span>Tradycyjna osada w górach Anaga. Oba plany umieszczają ją na przejeździe Cruz del Carmen → Taganana → Almáciga → Benijo, łącząc las, górskie widoki i wybrzeże.</span></button></li><li><button disabled=""><strong>Almáciga</strong><span class="place-meta">Anaga<!-- --> · <!-- -->Miasta i miejscowości</span><span>Mała osada na wybrzeżu Anaga między Tagananą i Benijo, wskazana w obu planach. Przystanek na eksplorację północno-wschodniej części wyspy. Pinezka wskazuje osadę, nie plażę.</span></button></li><li><button disabled=""><strong>Playa de Benijo</strong><span class="place-meta">Anaga<!-- --> · <!-- -->Plaże i ocean</span><span>Wspólna propozycja na wieczór w Anaga: czarny piasek, skały w oceanie, zdjęcia i zachód słońca. Oba plany łączą ją z Tagananą i Almácigą. To plaża z silnym falowaniem; widokowy przystanek nie oznacza bezpiecznej kąpieli.</span></button></li><li><button disabled=""><strong>Garachico</strong><span class="place-meta">Zachód<!-- --> · <!-- -->Miasta i miejscowości</span><span>Oba plany: historyczne miasteczko, stare centrum i wulkaniczne wybrzeże po erupcji z 1706 roku. Drugi plan łączy je w dniu 4 z El Caletón, Buenavistą/Teno i Mascą.</span></button></li><li><button disabled=""><strong>El Caletón · naturalne baseny</strong><span class="place-meta">Zachód<!-- --> · <!-- -->Plaże i ocean</span><span>Baseny w zastygłej lawie przy Garachico, wymienione w obu planach. W drugim: ewentualna kąpiel podczas dnia 4, tylko jeśli warunki morza na to pozwalają. Osobna pinezka ułatwia znalezienie basenów przy mieście.</span></button></li><li><button disabled=""><strong>La Orotava</strong><span class="place-meta">Północ<!-- --> · <!-- -->Miasta i miejscowości</span><span>Pierwszy plan poleca kanaryjską architekturę, drewniane balkony i brukowane uliczki. Drugi wskazuje miasto jako możliwą bazę na północy i punkt przejazdu w stronę Teide. Wspólny przystanek z różnymi rolami.</span></button></li><li><button disabled=""><strong>San Cristóbal de La Laguna</strong><span class="place-meta">Północ<!-- --> · <!-- -->Miasta i miejscowości</span><span>Wspólna propozycja: historyczne centrum UNESCO, kolorowa architektura, kawa i spacer po uliczkach. Drugi plan: 2–3 godziny w dniu 1, potem Punta del Hidalgo albo Bajamar.</span></button></li><li><button disabled=""><strong>Puerto de la Cruz · opcja bazy</strong><span class="place-meta">Północ<!-- --> · <!-- -->Miasta i miejscowości</span><span>Pierwszy plan: kilka godzin spaceru i jedzenia, z mniejszym priorytetem niż Anaga czy Garachico. Drugi poleca okolice miasta jako bazę na pięć dni zamiast kurortowego południa.</span></button></li><li><button disabled=""><strong>Icod de los Vinos · Drago Milenario</strong><span class="place-meta">Północ<!-- --> · <!-- -->Miasta i miejscowości</span><span>Opcjonalny postój z pierwszego planu po drodze do Garachico: słynne smocze drzewo. Drugi plan świadomie pomija Icod przy ograniczeniu do pięciu dni. Miasto i drzewo połączone w jeden przystanek; pinezka wskazuje Drago.</span></button></li><li><button disabled=""><strong>Punta del Hidalgo</strong><span class="place-meta">Północ<!-- --> · <!-- -->Plaże i ocean</span><span>Drugi plan: łagodniejsze zakończenie dnia 1 po La Lagunie — spacer nad oceanem, promenada, baseny i zachód słońca. Alternatywa dla Bajamar, nie obowiązkowy dodatkowy przystanek.</span></button></li><li><button disabled=""><strong>Bajamar</strong><span class="place-meta">Północ<!-- --> · <!-- -->Plaże i ocean</span><span>Drugi plan: alternatywa dla Punta del Hidalgo po spacerze po La Lagunie. Propozycja spokojnego fragmentu nad oceanem, z basenami i zachodem słońca.</span></button></li><li><button disabled=""><strong>Buenavista del Norte</strong><span class="place-meta">Zachód<!-- --> · <!-- -->Miasta i miejscowości</span><span>Drugi plan wskazuje Buenavistę/Teno między Garachico a wieczorną Mascą w dniu 4. To ogólny etap objazdu północnego zachodu; źródło nie wybiera tu konkretnej atrakcji.</span></button></li><li><button disabled=""><strong>Parque Rural de Teno</strong><span class="place-meta">Zachód<!-- --> · <!-- -->Góry i trekking</span><span>Górski obszar zachodu z drugiego planu, łączony z Buenavistą i Mascą. Pinezka jest orientacyjna dla parku. Źródło nie precyzuje punktu ani trasy; nie utożsamiamy ogólnego „Teno” z dodatkową wycieczką do Punta de Teno.</span></button></li></ul></div></div></section><footer><span class="status-dot"></span> Prywatny plan podróży<p>Najedź na pinezkę lub kliknij, aby zobaczyć zdjęcie i opis.</p></footer></aside><section class="map-panel" aria-label="Interaktywna mapa Teneryfy"><div class="map"></div><div class="map-toolbar"><span>Teneryfa, Hiszpania</span><button disabled="">Pokaż całą wyspę <span aria-hidden="true">↗</span></button></div><div class="map-message" role="status">Wczytywanie mapy…</div></section></main><!--$--><!--/$--><script src="/vacation-planner/_next/static/chunks/3l04zcqx63h3y.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[39756,[\"/vacation-planner/_next/static/chunks/3fntmmi971322.js\"],\"default\"]\n3:I[37457,[\"/vacation-planner/_next/static/chunks/3fntmmi971322.js\"],\"default\"]\n4:I[492,[\"/vacation-planner/_next/static/chunks/3fntmmi971322.js\",\"/vacation-planner/_next/static/chunks/3ni2jimsyhn6h.js\"],\"default\"]\n5:I[97367,[\"/vacation-planner/_next/static/chunks/3fntmmi971322.js\"
